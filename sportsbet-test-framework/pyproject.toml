[project]
name = "sportsbet-test-framework"
version = "0.1.0"
description = "Screenplay-based UI and API test framework for Single Bet Placement"
readme = "README.md"
authors = [
    { name = "Alejandro Areiza", email = "ing.alejandroareiza@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "allure-pytest>=2.16.2",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "selenium>=4.52.0",
]

[dependency-groups]
dev = [
    "pytest-rerunfailures>=16.7",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--alluredir=allure-results --reruns 0"
markers = [
    "smoke: Check basic stability & accept/reject build",
    "regression: Ensure new changes didn't break old features",
    "api: Design for api tests",
    "ui: Design for ui tests",
]
